<!-- templates/pasta_tarefas/modais/excluir_tarefa.html -->
<div id="modalConfirmacao"
     class="modal-confirmacao-overlay"
     onclick="fecharModalExcluir(event)">

    <div class="modal-confirmacao-box" onclick="event.stopPropagation()">
        <h3 id="modalTitulo">⚠️ Confirmar ação</h3>
        <p id="modalTexto">Tem certeza?</p>

        <div class="modal-confirmacao-actions">
            <button type="button"
                    id="btnCancelarExcluirTarefa"
                    class="btn-confirmacao-cancelar"
                    onclick="fecharModalExcluir(null)">
                Cancelar
            </button>
            <button type="button"
                    id="btnConfirmarExcluirTarefa"
                    class="btn-confirmacao-confirmar">
                Confirmar
            </button>
        </div>
    </div>
</div>
