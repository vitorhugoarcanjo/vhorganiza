<!-- templates/pasta_tarefas/modais/concluir_tarefa.html -->
<div class="modal-confirmacao-overlay"
     id="modalConcluirTarefa"
     onclick="fecharModalConcluir(event)">

    <div class="modal-confirmacao-box confirmar-concluir"
         onclick="event.stopPropagation()">

        <h3><i class="bi bi-check-circle"></i> Concluir Tarefa</h3>

        <p id="concluirTitulo">Tarefa: —</p>

        <label for="motivoConclusao"
               style="display:block; margin-top:10px; text-align:left; font-size:0.8rem; color:#aaa;">
            <i class="bi bi-chat-left-text"></i> Motivo / observações (opcional)
        </label>
        <textarea id="motivoConclusao"
                  name="motivo_conclusao"
                  class="form-input"
                  rows="3"
                  placeholder="Ex: Finalizada dentro do prazo..."
                  style="margin-top:6px;"></textarea>

        <div class="modal-confirmacao-actions">
            <button type="button"
                    class="btn-confirmacao-cancelar"
                    id="btnCancelarConcluirTarefa"
                    onclick="fecharModalConcluir(null)">
                <i class="bi bi-x-circle"></i> CANCELAR
            </button>
            <button type="button"
                    class="btn-confirmacao-confirmar"
                    id="btnConfirmarConcluirTarefa">
                <i class="bi bi-check-lg"></i> CONCLUIR
            </button>
        </div>

    </div>
</div>
