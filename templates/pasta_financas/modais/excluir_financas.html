<!-- templates/pasta_financas/modais/excluir_financas.html -->
<div id="modalExcluirFinancas"
     class="modal-confirmacao-overlay"
     onclick="fecharModalExcluirFinancas(event)">

    <div class="modal-confirmacao-box" onclick="event.stopPropagation()">
        <h3 id="modalExcluirTitulo">Inativar Transação</h3>
        <p id="modalExcluirTexto">Tem certeza que deseja inativar esta transação?</p>

        <!-- Área opcional pra detalhes extras (parcelamento, etc) -->
        <div id="detalhesParcelamento"
             style="display: none; margin-top: 10px; padding: 8px; background: #1e1e2f; border-radius: 5px;">
        </div>

        <div class="modal-confirmacao-actions">
            <button type="button"
                    id="btnCancelarExcluirFinancas"
                    class="btn-confirmacao-cancelar"
                    onclick="fecharModalExcluirFinancas(null)">
                Cancelar
            </button>
            <button type="button"
                    id="btnConfirmarExcluirFinancas"
                    class="btn-confirmacao-confirmar">
                Sim, inativar
            </button>
        </div>
    </div>
</div>
