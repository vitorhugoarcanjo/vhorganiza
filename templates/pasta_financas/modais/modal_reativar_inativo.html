<!-- templates/pasta_financas/modais/modal_reativar_inativo.html -->
<div id="modalReativar"
     class="modal-confirmacao-overlay"
     onclick="fecharModalReativar(event)">

    <div class="modal-confirmacao-box confirmar-primario" onclick="event.stopPropagation()">
        <h3 id="modalReativarTitulo">⚠️ Reativar Transação</h3>
        <p id="modalReativarTexto"></p>

        <div class="modal-confirmacao-actions">
            <button type="button"
                    id="btnCancelarReativar"
                    class="btn-confirmacao-cancelar"
                    onclick="fecharModalReativar(null)">
                Cancelar
            </button>
            <button type="button"
                    id="btnConfirmarReativar"
                    class="btn-confirmacao-confirmar">
                Confirmar Reativação
            </button>
        </div>
    </div>
</div>

<script>
    function fecharModalReativar(event) {
        // Se veio evento e o clique não foi no overlay, ignora (clique dentro não fecha)
        if (event && event.target) {
            var modal = document.getElementById('modalReativar');
            if (event.target !== modal) return;
        }
        var modal = document.getElementById('modalReativar');
        if (modal) modal.classList.remove('active');
    }

    document.addEventListener('click', function(e) {
        var modal = document.getElementById('modalReativar');
        if (modal && modal.classList.contains('active') && e.target === modal) {
            fecharModalReativar();
        }
    });
</script>
