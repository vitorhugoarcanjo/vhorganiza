<!-- templates/pasta_base_pre_login/base_pre_acesso.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>

    <!-- Bootstrap Icons (CDN — única dependência externa) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Cada tela carrega o SEU .min.css -->
    {% block styles %}{% endblock %}

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

    <!-- NAVBAR FIXA NO TOPO -->
    <nav class="main-navbar">
        <div class="nav-container">
            <div class="nav-menu-wrapper">
                <div class="nav-socials-desktop">
                    <a href="https://linkedin.com/in/vitor-hugo-arcanjo-dias-pereira-5919b5334/" target="_blank" rel="noopener" class="nav-social-icon" title="LinkedIn"><i class="bi bi-linkedin"></i></a>
                    <a href="https://github.com/vitorhugoarcanjo" target="_blank" rel="noopener" class="nav-social-icon" title="GitHub"><i class="bi bi-github"></i></a>
                    <a href="https://instagram.com/vitor.hadp/" target="_blank" rel="noopener" class="nav-social-icon" title="Instagram"><i class="bi bi-instagram"></i></a>
                    <a href="https://wa.me/5565999757941?text=Olá" target="_blank" rel="noopener" class="nav-social-icon" title="WhatsApp"><i class="bi bi-whatsapp"></i></a>
                </div>
            </div>
        </div>
    </nav>

    <button class="menu-toggle" aria-label="Abrir menu" onclick="toggleMenu()">
        <i class="bi bi-list"></i>
    </button>

    <div class="sidebar-overlay" onclick="toggleMenu()"></div>

    <div class="layout">
        <aside class="sidebar">
            <div class="logo">
                <a href="{{ url_for('ini_app') }}">⚡ VHORGANIZA</a>
                <button class="menu-close" onclick="toggleMenu()"><i class="bi bi-x-lg"></i></button>
            </div>

            <ul class="sidebar-links">
                <li><a href="{{ url_for('login.validar_login') }}" class="{{ 'active' if request.endpoint == 'login.validar_login' }}"><i class="bi bi-key"></i> Login</a></li>
                <li><a href="{{ url_for('cadastre_se.tela_cadastre_se') }}" class="{{ 'active' if request.endpoint == 'cadastre_se.tela_cadastre_se' }}"><i class="bi bi-person-plus"></i> Cadastre-se</a></li>
            </ul>

            <div class="nav-socials-mobile">
                <p>Siga meu trabalho:</p>
                <div class="socials-mobile-grid">
                    <a href="https://linkedin.com/in/vitor-hugo-arcanjo-dias-pereira-5919b5334/" target="_blank" rel="noopener" title="LinkedIn"><i class="bi bi-linkedin"></i></a>
                    <a href="https://github.com/vitorhugoarcanjo" target="_blank" rel="noopener" title="GitHub"><i class="bi bi-github"></i></a>
                    <a href="https://instagram.com/vitor.hadp/" target="_blank" rel="noopener" title="Instagram"><i class="bi bi-instagram"></i></a>
                    <a href="https://wa.me/5565999757941?text=Olá" target="_blank" rel="noopener" title="WhatsApp"><i class="bi bi-whatsapp"></i></a>
                </div>
            </div>
        </aside>

        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <footer class="footer">
        <p>© Vhorganiza · Sistema de Tarefas, Finanças e Orçamentos</p>
    </footer>

    <script>
        function toggleMenu() {
            document.body.classList.toggle('menu-active');
        }
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
